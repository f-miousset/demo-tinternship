# Serves the built SPA. Nothing here proxies /api: Traefik matches
# PathPrefix(`/api`) at a higher priority and sends those requests straight to
# the API container. Keeping nginx out of that path is deliberate — the
# interview endpoint streams SSE, and a proxy in front of it is one more place
# for a response to sit in a buffer until the run finishes.
#
# There is no auth logic here either. Authelia has already vetted the request by
# the time Traefik forwards it.

# How long each kind of file may be held, decided by path rather than by
# location block. `add_header` does not accumulate across levels: one in a
# location silently drops every header the server declared, which is how the CSP
# below used to end up missing from the one response that needs it most — the
# HTML shell. A map keeps all the headers in one place and all of them applied.
map $uri $cache_control {
  # The shell names the current asset hashes, so caching it is what would pin a
  # visitor to an old build.
  default                     "no-cache, no-store, must-revalidate";
  # The worker: revalidated on every registration and every update check, which
  # is what `no-cache` says. Deliberately not the `no-store` above — a worker
  # script is the one file whose staleness the browser already manages, and the
  # advice for it has always been revalidate, never refuse to store.
  /sw.js                      "no-cache";
  # /theme-boot.js is deliberately absent from this map. It runs before the
  # first paint and decides what that paint looks like, so it is part of the
  # shell and takes the shell's `no-store` above — 400 bytes on a cold load, in
  # exchange for never being able to stamp a theme the app no longer has.
  # Vite fingerprints everything under /assets, so those are safe to pin.
  ~^/assets/                  "public, max-age=31536000, immutable";
  # Icons and the manifest. `no-cache` is revalidate, not refuse: nginx answers
  # the conditional request with a 304 and no body, so the cost is one round
  # trip on files asked for about once a page.
  #
  # They were max-age=86400 until 2026-08-27, on the reasoning that icons change
  # about once a year. They do — and that is the problem, because their URLs
  # never change with them. The day the briefcase became a flame, every browser
  # holding a day-old copy kept serving the old mark, and an installed PWA reads
  # its launcher icon from exactly that cache. A file that changes rarely at a
  # URL that never changes is the case where a long max-age is most wrong, not
  # least.
  ~*\.(png|svg|ico|webmanifest)$  "no-cache";
}

server {
  listen 80;
  # Also on IPv6: inside the container "localhost" resolves to ::1 first, and a
  # health check that cannot connect makes Traefik drop the container entirely.
  listen [::]:80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css text/javascript application/javascript application/json image/svg+xml application/manifest+json;
  gzip_min_length 512;

  add_header Cache-Control $cache_control;

  # Everything the app loads comes from this origin — no CDN, no web fonts, no
  # analytics. The loosenings are real needs, not blanket ones:
  #   style-src 'unsafe-inline' — the score bars on the traces and application
  #     pages, and the document preview's scale, size themselves with a style prop.
  #   frame-src 'self' — the application page previews the rendered résumé in an
  #     iframe pointed at /api/…/preview, same origin.
  #   worker-src 'self' — the offline shell in public/sw.js.
  add_header X-Content-Type-Options "nosniff";
  add_header Referrer-Policy "no-referrer";
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-src 'self'; worker-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'";

  # React Router owns the paths (/jobs, /account, /traces/…); they are not files.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # An installed app registers its worker from the root, so this file must be
  # served as itself and never rewritten to the SPA shell by the try_files above.
  location = /sw.js {
    try_files $uri =404;
  }

  # The theme boot script, for the same reason and with the same guard as the
  # worker above: it is loaded by path from the shell, and try_files answering it
  # with index.html would hand the browser HTML to execute as JavaScript. The
  # visible result is a syntax error and an app that paints the wrong theme for
  # a frame on every cold load — see frontend/index.html.
  #
  # It is a file at all, rather than the inline script it would obviously be,
  # because `script-src 'self'` above has no 'unsafe-inline': inline works
  # perfectly in dev and is blocked here. Do not inline it.
  location = /theme-boot.js {
    try_files $uri =404;
  }

  # nginx's mime.types knows nothing about .webmanifest, and a manifest arriving
  # as application/octet-stream is one the browser may decline to read — which
  # shows up as an app that cannot be installed, with no error anywhere.
  location = /manifest.webmanifest {
    default_type application/manifest+json;
  }

  # /favicon.ico used to answer 204 because there was no icon to give. There is
  # one now, and it is the file every bookmark list, pinned tab and link preview
  # asks for without ever reading the <link> tags in index.html.
  location = /favicon.ico {
    try_files $uri =404;
    access_log off;
  }
}
