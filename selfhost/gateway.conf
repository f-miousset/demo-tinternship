# One origin for the UI and the API, as the app expects (app/frontend/src/lib/api.ts
# calls /api relative to the page). In the author's own deployment a reverse
# proxy does this routing; this file is the same rule for a single machine.
server {
  listen 80;
  server_name _;

  # Résumés, LinkedIn exports and ZIPs: the API refuses anything over 25 MB.
  client_max_body_size 30m;

  location /api/ {
    proxy_pass http://api:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    # The agent runs answer with server-sent events for minutes at a time.
    # Buffering would hold every progress line until the run ended.
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }

  location / {
    proxy_pass http://web:80;
    proxy_set_header Host $host;
  }
}
