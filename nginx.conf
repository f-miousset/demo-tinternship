# Serves the built demo. Nothing else: no API, no proxy, no write path. A POST,
# PUT or DELETE gets nginx's own 405, and ci/smoke.sh sends some to prove it —
# "nobody's data reaches the server" is only true while the server cannot
# accept any. Every /api call the app makes is answered inside the browser by
# demo/src/mock; the only /api paths that exist here are the files below.

# Headers by path, in ONE place. `add_header` does not accumulate across
# levels — one inside a location silently drops every header declared at the
# server level, which is how a CSP goes missing. So headers live at server
# level only, and what differs per path is these maps.
map $uri $cache_control {
  default                        "no-cache";
  ~^/assets/                     "public, max-age=31536000, immutable";
  ~*\.(png|svg|ico)$             "public, max-age=86400";
}

# The document preview is shown in an <iframe> on this origin, so it — and only
# it — may be framed by this origin.
map $uri $frame_ancestors {
  default                                             "'none'";
  ~^/api/applications/artifacts/\d+/preview           "'self'";
}
map $uri $frame_options {
  default                                             "DENY";
  ~^/api/applications/artifacts/\d+/preview           "SAMEORIGIN";
}

server {
  listen 80;
  listen [::]:80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json text/html;
  gzip_min_length 512;

  add_header Cache-Control $cache_control always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header X-Frame-Options $frame_options always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
  # The real app's CSP (app/deploy/nginx.conf), with the frame rule per path.
  # connect-src 'self' is the demo's privacy promise as a browser-enforced
  # rule: the page cannot send a visitor's data anywhere, even if a future
  # change tried to. 'unsafe-inline' is for styles only — the app sets style
  # attributes from React — and never for scripts, which is why the theme boot
  # script is a file.
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors $frame_ancestors" always;
  # Empty except on a download: the name the real API would have given it.
  # Defined in conf.d/00-export-names.conf, generated by the build.
  add_header Content-Disposition $export_disposition always;

  # React Router owns the paths; they are not files.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Files loaded BY PATH must be served as themselves or 404 — never rewritten
  # to the SPA shell, or the browser executes HTML as JavaScript.
  location = /theme-boot.js { try_files $uri =404; }
  location = /sw.js { try_files $uri =404; }
  location ^~ /assets/ { try_files $uri =404; }
  location ^~ /demo-data/ { try_files $uri =404; }

  # nginx's mime.types has no .webmanifest entry, and a manifest served as
  # application/octet-stream can make a browser decline to install the app,
  # with no error anywhere. A `types` block at server level would replace the
  # whole table rather than add to it, so the fix is scoped to this one file.
  location = /manifest.webmanifest {
    types { } default_type application/manifest+json;
    try_files $uri =404;
  }

  # The two kinds of /api request that are not fetch calls: the preview
  # (an iframe) and the download (a link). Prebuilt by scripts/build_seed.py.
  location ~ ^/api/applications/artifacts/(\d+)/preview$ {
    try_files /api/applications/artifacts/$1/preview.html =404;
  }
  location ~ ^/api/applications/artifacts/(\d+)/export$ {
    try_files /api/applications/artifacts/$1/export.docx =404;
  }
  # Anything else under /api never reaches here from the app (the mock answers
  # it in the page) and must not fall through to the SPA shell.
  location /api/ {
    return 404;
  }
}
